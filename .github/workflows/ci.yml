name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is included deliberately: a real Windows-only bug (failed
        # SQLite file rename after an upgrade rollback) shipped undetected
        # because CI only ever ran on Linux. See PROJECT_STATUS.md.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build frontend (React pilot)
        run: npm run build

      - name: Run full test suite (isolated per package)
        run: npm run test:all

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      # Gerçek bir Chromium'a karşı çalışır — jsdom'un YAKALAYAMADIĞI hata
      # sınıfını kapatır (bkz. Aşama 6: public/css/mobile.css'teki
      # [hidden]{display:none} eksikliği yalnızca burada ortaya çıkardı).
      - name: Run real-browser E2E tests (Playwright)
        run: npm run test:e2e-browser

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}-node${{ matrix.node }}
          path: playwright-report/
          retention-days: 14

      - name: Audit production dependencies
        run: npm audit --omit=dev
