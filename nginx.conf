# Depo Takip ERP — ters vekil örneği
# TLS için certs/ klasörüne fullchain.pem ve privkey.pem koyun,
# ardından aşağıdaki HTTPS bloğunun yorumunu kaldırın.

upstream depo_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    # TLS aktifse tüm trafiği HTTPS'e yönlendirin:
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;

    location / {
        proxy_pass         http://depo_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Statik varlıklar uygulamadan bağımsız olarak önbelleğe alınabilir
    location ~* \.(css|js|woff2?|png|jpg|svg)$ {
        proxy_pass    http://depo_app;
        expires       7d;
        add_header    Cache-Control "public";
    }
}

