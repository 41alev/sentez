name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is included deliberately: a real Windows-only bug (failed
        # SQLite file rename after an upgrade rollback) shipped undetected
        # because CI only ever ran on Linux. See PROJECT_STATUS.md.
        os: [ubuntu-latest, windows-latest]
        # better-sqlite3@13 declares "engines.node": ">=22" — Node 20 is not
        # a supported runtime for this dependency, so testing it would only
        # prove behavior on an unsupported configuration.
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # node-gyp's own Visual Studio detection fails on GitHub's windows-latest
      # image: even running inside a VS command prompt (which the step below
      # sets up) and even when forced with msvs_version, the node-gyp version
      # bundled with npm does not have this VS release in its lookup table and
      # aborts ("unknown version undefined" / "msvs_version does not match").
      # The fix is a newer node-gyp release with an updated VS version table,
      # installed separately and pointed to via npm_config_node_gyp — this is
      # npm's own documented workaround for exactly this class of failure.
      # Needed as a fallback in case better-sqlite3's bundled prebuilt binary
      # is ever unavailable and it must build from source.
      - name: Set up MSVC (Windows native module builds)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install up-to-date node-gyp (Windows)
        if: runner.os == 'Windows'
        id: nodegyp
        shell: bash
        run: |
          npm install -g node-gyp@latest
          echo "path=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_node_gyp: ${{ runner.os == 'Windows' && steps.nodegyp.outputs.path || '' }}

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build frontend (React pilot)
        run: npm run build

      - name: Run full test suite (isolated per package)
        run: npm run test:all

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      # Gerçek bir Chromium'a karşı çalışır — jsdom'un YAKALAYAMADIĞI hata
      # sınıfını kapatır (bkz. Aşama 6: public/css/mobile.css'teki
      # [hidden]{display:none} eksikliği yalnızca burada ortaya çıkardı).
      - name: Run real-browser E2E tests (Playwright)
        run: npm run test:e2e-browser

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}-node${{ matrix.node }}
          path: playwright-report/
          retention-days: 14

      - name: Audit production dependencies
        run: npm audit --omit=dev
