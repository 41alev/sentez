# Dream Plus — ters vekil örneği
# TLS için certs/ klasörüne fullchain.pem ve privkey.pem koyun,
# ardından aşağıdaki HTTPS bloğunun yorumunu kaldırın.

upstream depo_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    # TLS aktifse tüm trafiği HTTPS'e yönlendirin:
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;

    location / {
        proxy_pass         http://depo_app;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # $remote_addr KENDİSİ kullanılır, $proxy_add_x_forwarded_for DEĞİL:
        # bu nginx internet'e açık tek kenar (docker-compose.yml'de tek ters
        # vekil), önündeki bir CDN/başka bir vekil yok. append eden
        # $proxy_add_x_forwarded_for, istemcinin kendi gönderdiği sahte bir
        # X-Forwarded-For değerini olduğu gibi korurdu; uygulamadaki
        # `trust proxy: 1` ayarıyla birleşince bu sahte değer req.ip olarak
        # güvenilir hale gelir ve giriş kaba-kuvvet kilidini/genel API hız
        # sınırlayıcısını her istekte farklı bir "IP" ile atlatmak mümkün olur.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # JS/CSS names are stable across releases: always revalidate them.
    location ~* \.(css|js)$ {
        proxy_pass    http://depo_app;
        expires       off;
        add_header    Cache-Control "no-cache" always;
    }

    location ~* \.(woff2?|png|jpg|svg)$ {
        proxy_pass    http://depo_app;
        expires       7d;
        add_header    Cache-Control "public";
    }
}

