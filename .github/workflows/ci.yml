name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is included deliberately: a real Windows-only bug (failed
        # SQLite file rename after an upgrade rollback) shipped undetected
        # because CI only ever ran on Linux. See PROJECT_STATUS.md.
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite (872 checks, isolated per package)
        run: npm run test:all

      - name: Audit production dependencies
        run: npm audit --omit=dev
