<!DOCTYPE html>
<html lang="tr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentez ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
  integrity="sha384-bs/nf9FbdNouRbMiFcrcZfLXYPKiPaGVGplVbv7dLGECccEXDW+S3zjqSKR5ZEaD" crossorigin="anonymous"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-screen" id="loginScreen">
  <form class="login-card" id="loginForm">
    <div class="brand" style="border:none;padding:0;margin-bottom:20px">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1B1E21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
      </div>
      <div class="brand-text"><h1>Sentez</h1></div>
    </div>
    <div class="field"><label data-i18n="loginUsername">Kullanıcı adı</label><input type="text" id="loginUsername" autocomplete="username" required></div>
    <div class="field"><label data-i18n="loginPassword">Şifre</label><input type="password" id="loginPassword" autocomplete="current-password" required></div>
    <div class="login-error" id="loginError"></div>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" data-i18n="loginSubmit">Giriş Yap</button>
    <div class="login-lang">
      <select id="loginLang" class="btn btn-ghost btn-sm"><option value="tr">Türkçe</option><option value="en">English</option></select>
    </div>
  </form>
</div>

<!-- ============ APP ============ -->
<div class="shell" id="appShell" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1B1E21" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>
      </div>
      <div class="brand-text"><h1 id="brandName">Sentez</h1></div>
    </div>

    <div class="global-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="global-search-icon"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="gsInput" data-i18n-placeholder="globalSearchPlaceholder" placeholder="Ürün, müşteri, sipariş, parti ara…" autocomplete="off">
      <div class="global-search-results hidden" id="gsResults"></div>
    </div>

    <nav id="navRoot">
      <div class="nav-group">
        <button class="nav-tab active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          <span data-i18n="navDashboard">Panel</span>
        </button>
      </div>

      <div class="nav-group-title" data-i18n="navGroupStock">Stok</div>
      <div class="nav-group">
        <button class="nav-tab" data-view="items">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>
          <span data-i18n="navItems">Ürünler</span>
        </button>
        <button class="nav-tab" data-view="lots">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"/><path d="M12 12v4"/></svg>
          <span data-i18n="navLots">Partiler / Lotlar</span>
        </button>
        <button class="nav-tab" data-view="counts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
          <span data-i18n="navCounts">Sayım</span>
        </button>
      </div>

      <div class="nav-group-title" data-i18n="navGroupOps">Operasyon</div>
      <div class="nav-group">
        <button class="nav-tab" data-view="production">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M4 21V9l6 4V9l6 4V6l4-3v18"/></svg>
          <span data-i18n="navProduction">Üretim</span>
        </button>
        <button class="nav-tab" data-view="purchasing">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2v4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-4V2"/><path d="M9 13h6M9 17h6"/></svg>
          <span data-i18n="navPurchasing">Satın Alma</span>
          <span class="nav-badge warn hidden" id="badgeApprovals">0</span>
        </button>
        <button class="nav-tab" data-view="crm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          <span data-i18n="navCrm">Fırsatlar</span>
        </button>
        <button class="nav-tab" data-view="support">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span data-i18n="navSupport">Destek</span>
        </button>
        <button class="nav-tab" data-view="sales">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
          <span data-i18n="navSales">Satış</span>
        </button>
        <button class="nav-tab" data-view="planning">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h3M8 18h6"/></svg>
          <span data-i18n="navPlanning">Planlama</span>
        </button>
        <button class="nav-tab" data-view="quality">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
          <span data-i18n="navQuality">Kalite</span>
          <span class="nav-badge hidden" id="badgeQuality">0</span>
        </button>
      </div>

      <div class="nav-group-title" data-i18n="navGroupAnalysis">Analiz</div>
      <div class="nav-group">
        <button class="nav-tab" data-view="reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
          <span data-i18n="navReports">Raporlar</span>
        </button>
        <button class="nav-tab" data-view="admin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span data-i18n="navAdmin">Yönetim</span>
        </button>
      </div>
    </nav>

    <div class="side-foot">
      <!-- Depo personeli terminale buradan geçer; ayrı bir adres ezberlemek zorunda kalmasın -->
      <a class="btn btn-ghost btn-sm" href="/mobile.html" style="justify-content:center;margin-bottom:8px;text-decoration:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:15px;height:15px"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
        <span data-i18n="warehouseTerminal">Depo Terminali</span>
      </a>
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">A</div>
        <div class="user-meta"><div class="n" id="userName">—</div><div class="r" id="userRole">—</div></div>
        <button class="icon-btn" id="btnNotifications" title="Bildirimler">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
      </div>
      <div style="display:flex;gap:6px">
        <select id="langSelect" class="btn btn-ghost btn-sm" style="flex:1"><option value="tr">TR</option><option value="en">EN</option></select>
        <button class="btn btn-ghost btn-sm" id="btnLogout" style="flex:2;justify-content:center" data-i18n="logout">Çıkış</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-items"></section>
    <section class="view" id="view-lots"></section>
    <section class="view" id="view-counts"></section>
    <section class="view" id="view-production"></section>
    <section class="view" id="view-purchasing"></section>
    <section class="view" id="view-crm"></section>
    <section class="view" id="view-support"></section>
    <section class="view" id="view-sales"></section>
    <section class="view" id="view-planning"></section>
    <section class="view" id="view-quality"></section>
    <section class="view" id="view-reports"></section>
    <section class="view" id="view-admin"></section>
  </main>
</div>

<!-- Notification panel -->
<div class="notif-panel" id="notifPanel">
  <div class="notif-head">
    <h3 data-i18n="notifTitle">Bildirimler</h3>
    <div style="display:flex;gap:6px">
      <button class="btn btn-ghost btn-sm" id="btnNotifScan" data-i18n="notifScan">Tara</button>
      <button class="btn btn-ghost btn-sm" id="btnNotifReadAll" data-i18n="notifReadAll">Tümünü Oku</button>
      <button class="icon-btn" id="btnNotifClose" title="Kapat" aria-label="Kapat"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
  </div>
  <div class="notif-list" id="notifList"></div>
</div>

<!-- Generic modal host -->
<div class="overlay" id="modalOverlay"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/dist/vendor-react.js"></script>
<script src="/dist/view-dashboard.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
